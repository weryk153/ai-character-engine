name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Preserve candidate bytes on every platform
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,service]"
      - name: Full pytest, compileall and release matrix self-check with receipts
        run: >-
          python -m ai_character_engine.release_candidate evidence
          --project-root .
          --python-version "${{ matrix.python-version }}"
          --source "github-actions:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.sha }}:${{ runner.os }}"
          --output "${{ runner.temp }}/rc-evidence-${{ runner.os }}-py${{ matrix.python-version }}.json"
      - name: Show failing tests
        # The evidence step keeps only the pytest summary; print what failed.
        if: failure()
        run: python -m pytest -q -rf --tb=short -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-evidence-${{ runner.os }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/rc-evidence-${{ runner.os }}-py${{ matrix.python-version }}.json
          if-no-files-found: error

  distributions:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve candidate bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install acceptance tooling and populate locked dependency metadata
        run: |
          python -m pip install -e ".[dev,service]" build
          uv sync --locked --extra dev --extra service
      - name: Soak, same-profile performance, four artifacts, fresh wheel/sdist installs, offline lock and neutrality
        run: python tools/final_acceptance.py --output "${{ runner.temp }}/final-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-acceptance
          path: ${{ runner.temp }}/final-acceptance/
          if-no-files-found: error

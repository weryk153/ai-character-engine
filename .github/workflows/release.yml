name: Release Candidate Artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Preserve candidate bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: rc-evidence-*
          path: rc-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: final-acceptance
          path: ${{ runner.temp }}/final-acceptance
      - name: Install read-only acceptance tooling
        run: python -m pip install -e . --no-deps
      - name: Aggregate the same candidate bytes and inspected distribution hashes
        shell: bash
        run: |
          python -m ai_character_engine.release_candidate check \
            --project-root . \
            --evidence-dir rc-evidence \
            --acceptance-evidence-dir "$RUNNER_TEMP/final-acceptance/acceptance" \
            --artifact "$RUNNER_TEMP"/final-acceptance/distributions/core/*.whl \
            --artifact "$RUNNER_TEMP"/final-acceptance/distributions/core/*.tar.gz \
            --artifact "$RUNNER_TEMP"/final-acceptance/distributions/vrm/*.whl \
            --artifact "$RUNNER_TEMP"/final-acceptance/distributions/vrm/*.tar.gz \
            --output "$RUNNER_TEMP/final-acceptance/v1-release-candidate-report.json"
      - name: Enforce v1 gate for stable tags
        if: startsWith(github.ref, 'refs/tags/v1.')
        shell: bash
        run: |
          python -m ai_character_engine.release_candidate check \
            --project-root . --evidence-dir rc-evidence \
            --acceptance-evidence-dir "$RUNNER_TEMP/final-acceptance/acceptance" \
            --artifact "$RUNNER_TEMP"/final-acceptance/distributions/core/*.whl \
            --artifact "$RUNNER_TEMP"/final-acceptance/distributions/core/*.tar.gz \
            --artifact "$RUNNER_TEMP"/final-acceptance/distributions/vrm/*.whl \
            --artifact "$RUNNER_TEMP"/final-acceptance/distributions/vrm/*.tar.gz \
            --fail-on-blocker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-character-engine-distributions
          path: ${{ runner.temp }}/final-acceptance/

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-character-engine-vrm"
version = "1.0.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "Optional VRM renderer adapter for ai-character-engine."
requires-python = ">=3.11"
dependencies = ["ai-character-engine>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/weryk153/ai-character-engine"
Documentation = "https://github.com/weryk153/ai-character-engine/blob/main/docs/README.md"

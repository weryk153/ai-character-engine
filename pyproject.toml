[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-character-engine"
version = "1.3.2"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "A modular open-source engine for building stateful LLM-powered characters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
ai-character-engine-release = "ai_character_engine.release.__main__:main"
ai-character-engine-rc = "ai_character_engine.release_candidate.__main__:main"
ai-character-engine-serve = "ai_character_engine.companion_service.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27,<1", "tzdata>=2024.1; sys_platform == 'win32'"]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3", "websockets>=13,<17"]
qdrant = ["qdrant-client>=1.10,<2"]
local = ["httpx>=0.27,<1"]
voice-audio = ["sounddevice>=0.5,<0.6", "httpx>=0.27,<1"]
voice-sherpa = ["httpx>=0.27,<1", "sounddevice>=0.5,<0.6", "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8; sys_platform == 'darwin'", "numpy>=1.26,<3"]
voice-mac = ["httpx>=0.27,<1", "sounddevice>=0.5,<0.6", "faster-whisper>=1.1,<2", "numpy>=1.26,<3"]
training = ["datasets>=3,<5", "transformers>=4.48,<6", "peft>=0.14,<1", "trl>=0.15,<2", "accelerate>=1,<2"]
training-qlora = ["datasets>=3,<5", "transformers>=4.48,<6", "peft>=0.14,<1", "trl>=0.15,<2", "accelerate>=1,<2", "bitsandbytes>=0.45,<1"]

[tool.pytest.ini_options]
pythonpath = ["src", "packages/renderer-vrm/src"]
asyncio_mode = "auto"
markers = [
  "integration: requires optional external services/dependencies",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/weryk153/ai-character-engine"
Documentation = "https://github.com/weryk153/ai-character-engine/blob/main/docs/README.md"
